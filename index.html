<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LaTeX to Markdown Converter</title>
    <link rel="icon" href="data:," />
    <script>
      function replaceAltDisplayMath(text) {
        return text.replace(
          /^[ \t]*\[[ \t]*\r?\n([\s\S]*?)^[ \t]*\][ \t]*(?=\r?$)/gm,
          (_, math) => `$$\n${math.trim()}\n$$`
        )
      }

      function replaceAltInlineMath(text) {
        let result = ''
        let start = 0
        let open = text.indexOf('( ')

        while (open !== -1) {
          result += text.slice(start, open)

          let depth = 1
          let end = open + 2
          while (end < text.length && depth > 0) {
            if (text[end] === '(') depth++
            if (text[end] === ')') depth--
            end++
          }

          if (depth === 0 && text[end - 2] === ' ') {
            const math = text.slice(open + 2, end - 1).trim()
            result += math ? `$${math}$` : text.slice(open, end)
          } else {
            result += text.slice(open, end)
          }

          start = end
          open = text.indexOf('( ', start)
        }

        return result + text.slice(start)
      }

      function replaceMath(text) {
        // Match fenced code blocks, inline code, and explicit LaTeX delimiters.
        const pattern =
          /^[ \t]{0,3}(`{3,}|~{3,})[^\r\n]*\r?\n[\s\S]*?(?:^[ \t]{0,3}\1[`~]*[ \t]*(?=\r?$)|(?![\s\S]))|(?<!`)(`+)(?!`)[\s\S]*?(?<!`)\2(?!`)|(\\{1,2})\(([^\r\n]*?)\3\)|(\\{1,2})\[([\s\S]*?)\5\]/gm

        let result = ''
        let start = 0

        function convertAlternativeMath(prose) {
          return replaceAltInlineMath(
            replaceAltDisplayMath(prose)
          )
        }

        for (const match of text.matchAll(pattern)) {
          result += convertAlternativeMath(text.slice(start, match.index))

          const [, fence, inlineCode, , inlineMath, , displayMath] = match
          if (fence || inlineCode) {
            result += match[0]
          } else if (inlineMath !== undefined) {
            result += `$${inlineMath.trim()}$`
          } else {
            result += `$$\n${displayMath.trim()}\n$$`
          }

          start = match.index + match[0].length
        }

        return result + convertAlternativeMath(text.slice(start))
      }

      function convertLatexToMarkdown() {
        const inputText = document.getElementById('inputText').value
        document.getElementById('output').textContent = replaceMath(inputText)
      }

      async function copyToClipboard() {
        const outputText = document.getElementById('output').textContent
        await navigator.clipboard.writeText(outputText)
      }
    </script>
  </head>
  <body>
    <h1>LaTeX to Markdown Converter</h1>
    <textarea id="inputText" rows="15" cols="80"></textarea><br />
    <button type="button" onclick="convertLatexToMarkdown()">Convert</button>
    <pre
      id="output"
      style="
        white-space: pre-wrap;
        word-wrap: break-word;
        background-color: #f0f0f0;
        padding: 10px;
        border: 1px solid #ccc;
      "
    ></pre>
    <button type="button" onclick="copyToClipboard()">Copy Output</button>
  </body>
</html>
